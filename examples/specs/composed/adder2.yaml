# 2-Bit-Addierer: a = a1..a0, b = b1..b0 (Bit 0 zuerst), Summe s1..s0 und Übertrag c.
# Zerlegung mit gemeinsamem Teil: der Übertrag jeder Stufe treibt die nächste (Ripple-Carry).
inputs: [a0, a1, b0, b1]
outputs: [s0, s1, c]
table:
  "0000": "000"
  "0001": "010"
  "0010": "100"
  "0011": "110"
  "0100": "010"
  "0101": "001"
  "0110": "110"
  "0111": "101"
  "1000": "100"
  "1001": "110"
  "1010": "010"
  "1011": "001"
  "1100": "110"
  "1101": "101"
  "1110": "001"
  "1111": "011"
