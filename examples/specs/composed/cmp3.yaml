# 3-Bit-Größenvergleich: a = a2 a1 a0, b = b2 b1 b0. gt: a > b, lt: a < b.
# Zerlegung mit zwei gemeinsamen Signalen: die oberen Bits liefern „größer“ und „kleiner“ (drei Fälle),
# die unteren entscheiden nur bei Gleichstand.
inputs: [a2, b2, a1, b1, a0, b0]
function:
  gt: (a2+a2+a2+a2 + a1+a1 + a0) > (b2+b2+b2+b2 + b1+b1 + b0)
  lt: (a2+a2+a2+a2 + a1+a1 + a0) < (b2+b2+b2+b2 + b1+b1 + b0)
