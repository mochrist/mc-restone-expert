    - [1, 1, 0, "comparator[facing=west,mode=compare,powered=false]"]
    - [0, 1, 2, "lectern[facing=north,has_book=true,powered=false]"]
    - [1, 1, 2, "comparator[facing=west,mode=compare,powered=false]"]
    - [0, 1, 4, "lectern[facing=north,has_book=true,powered=false]"]
    - [1, 1, 4, "comparator[facing=west,mode=compare,powered=false]"]
    - [0, 1, 6, "lectern[facing=north,has_book=true,powered=false]"]
    - [1, 1, 6, "comparator[facing=west,mode=compare,powered=false]"]
    - [0, 1, 8, "lectern[facing=north,has_book=false,powered=false]"]
    - [1, 1, 8, "comparator[facing=west,mode=compare,powered=false]"]
  block_entities:
    - [0, 1, 0, '{id:"minecraft:lectern",Page:2,Book:{id:"minecraft:writable_book",count:1,components:{"minecraft:writable_book_content":{pages:[{raw:"a"},{raw:"b"},{raw:"c"},{raw:"d"},{raw:"e"}]}}}}']
    - [0, 1, 2, '{id:"minecraft:lectern",Page:4,Book:{id:"minecraft:writable_book",count:1,components:{"minecraft:writable_book_content":{pages:[{raw:"a"},{raw:"b"},{raw:"c"},{raw:"d"},{raw:"e"}]}}}}']
