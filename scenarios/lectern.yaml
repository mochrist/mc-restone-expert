    - [1, 1, 4, '{id:"minecraft:comparator",OutputSignal:0}']
    - [1, 1, 6, '{id:"minecraft:comparator",OutputSignal:0}']
    - [1, 1, 8, '{id:"minecraft:comparator",OutputSignal:0}']
