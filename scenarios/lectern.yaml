name: lectern
description: >
  Comparator liest Lesepulte (Rechtsklick auf den Comparator löst die Neuberechnung aus). z=0: Buch mit
  5 Seiten, Seite 2 (Index ab 0): floor(2/4 * 14) + 1 = 8. z=2: Seite 4 von 5: 15. z=4: Buch mit einer Seite: 15.
  z=6: has_book=true, aber kein Buch im Block-Entity: Seitenzahl 0, Fortschritt 1, ohne Buch-Bonus: 14.
  z=8: has_book=false: 0.
build:
  size: [3, 2, 9]
  fill:
    - [0, 0, 0, 2, 0, 8, "stone"]
  blocks:
