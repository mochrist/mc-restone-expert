name: seq-monostable-observer
description: 'Vorlage monostable-observer (length=2, delay=4, kind=lever) aus src/redstone/design/seq_templates.py: Kupferbirne
  direkt am Eingang wechselt bei jeder steigenden Flanke; ein Komparator liest sie aus, ein Observer schaut auf den Komparator
  und gibt bei jedem Wechsel einen 2-gt-Puls an die Lampe. Fallende Flanken ändern die Birne nicht. 2 gt lang, Verzögerung
  4 gt. Achtung: Bekommt beim Einfügen jeder Block ein Update, feuert der Observer einmal. Testabläufe nacheinander: Hebel
  1 gt an ab Tick 0; Hebel 2 gt an ab Tick 58; Hebel 3 gt an ab Tick 116; Hebel 5 gt an ab Tick 174; Hebel 10 gt an ab Tick
  232; Hebel 20 gt an ab Tick 294; Hebel 40 gt an ab Tick 366.'
