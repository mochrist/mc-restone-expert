name: kb3-torch-burnout
description: Fackel-Burnout und das 60-gt-Fenster. Ein Hebel an der Seite des Blocks unter einer Fackel schaltet
  die Fackel 7-mal im Abstand von 8 gt aus (Eintraege bei 4, 12, ..., 52). Der 8. Hebelimpuls kommt in jeder Bahn
  zu einer anderen Zeit, sodass der erste Eintrag (4) beim 8. Ausschalten 58 bis 63 gt alt ist. Bis genau 60 gt
  zaehlt er mit (Burnout, die Fackel bleibt aus), ab 61 wird er vorher entfernt (kein Burnout, die Fackel geht nach
  dem Hebel wieder an).
