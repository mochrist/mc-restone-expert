name: hopper-lock
description: >
  Hopper H (5 Eisenschwerter, Comparator 15/12/9/6/...) gibt alle 8 gt ins Fass (Tick 1, 9). Hebel auf einem
  Stein neben H sperrt ihn bei 12 sofort (enabled=false), der fällige Transfer bei 17 entfällt. Der Cooldown
  läuft im gesperrten Zustand ab: nach dem Entsperren bei 22 überträgt H gleich im nächsten Tick (23).
  Hopper H2 (z=4): Ein Redstone-Block diagonal über H2 (Tick 4) powert die Position über H2; trotz Update
  bei 6 bleibt H2 entsperrt (kein QC) und überträgt weiter alle 8 gt.
