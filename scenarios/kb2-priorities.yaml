name: kb2-priorities
description: >
  Tick-Prioritäten, Sperre und Tick-Typ. Ein Ziel-Repeater Tg (Delay 1) bekommt bei Tick 2 Eingang vom Hebel A,
  daneben sperrt ein zweites Gerät (L) Tg von der Seite; beide Ticks sind für Tick 4 fällig. z=0 (REP-009): L ist
  ein Repeater, den Hebel B nach A (also später geplant) einschaltet; L hat vor sich eine Diode, die nicht
  zurückzeigt (EXTREMELY_HIGH) und läuft trotz späterer Planung vor Tg: Tg ist gesperrt, die Lampe bleibt aus.
  z=4 (CMP-003, TCK-006, ORD-003): L ist ein Comparator (HIGH), B kommt vor A: gleiche Priorität wie Tg (HIGH),
  der Comparator ist früher geplant und läuft zuerst, Lampe bleibt aus. z=8 (TCK-006, ORD-003): wie z=4, aber A
  vor B: Tg ist früher geplant, schaltet zuerst ein, die Lampe geht bei 4 an (danach hält die Sperre Tg).
  z=12 und z=14 (REP-015): `locked` wird beim Setzen nicht neu berechnet, die Logik nutzt die Live-Berechnung:
  Ein Repeater mit veraltetem locked=true ohne Sperr-Diode schaltet normal ein (z=12); einer mit locked=false, den
  ein eingeschalteter Repeater von der Seite speist, bleibt gesperrt aus (z=14). z=18 und z=20 (ORD-006): Eine
  Lampe plant bei einem Neighbor-Update einen Tick (4 gt); wird sie vorher durch einen Repeater ersetzt, läuft der
  Tick nicht auf dem Repeater (z=18, würde er laufen, schaltete der Repeater ein; er bleibt aus), ohne Austausch geht die Lampe bei 6 aus (z=20).
