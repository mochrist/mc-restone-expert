name: seq-monostable-piston-button
description: 'Vorlage monostable-piston-button (length=3, delay=2, kind=button) aus src/redstone/design/seq_templates.py:
  Genau 3 gt: Der Knopf speist den Rückeingang eines Komparators (Subtraktion) und über eine getrennte Staubleitung einen
  Klebekolben. Ein per Spieleraktion bestromter Kolben fährt einen Tick später aus und schiebt seinen Redstone-Block nach
  weiteren 2 gt neben den Komparator; das ist der einzige ungerade Verzögerungsanteil. Der Ausgang geht 2 gt nach dem Knopfdruck
  an und 2 gt nach der Ankunft des Blocks wieder aus. Der Staub zum Kolben darf den Zielplatz des Blocks nicht berühren, sonst
  hielte er sich selbst. Mit Hebel nicht möglich: Pulse unter 3 gt lassen den Klebekolben den Block fallen oder gar nicht
  ausfahren. Testabläufe nacheinander: Knopfdruck ab Tick 0.'
build:
  size: [4, 2, 4]
  blocks:
  - [0, 0, 0, stone]
  - [0, 0, 1, stone]
  - [0, 0, 2, stone]
  - [0, 0, 3, stone]
  - [0, 1, 0, 'stone_button[face=floor,facing=east,powered=false]']
  - [0, 1, 1, 'redstone_wire[east=none,north=side,power=0,south=side,west=none]']
  - [0, 1, 2, 'redstone_wire[east=none,north=side,power=0,south=side,west=none]']
  - [0, 1, 3, 'redstone_wire[east=side,north=side,power=0,south=none,west=none]']
  - [1, 0, 0, stone]
  - [1, 0, 3, stone]
  - [1, 1, 0, 'redstone_wire[east=side,north=none,power=0,south=none,west=side]']
  - [1, 1, 3, 'redstone_wire[east=side,north=none,power=0,south=none,west=side]']
  - [2, 0, 0, stone]
  - [2, 1, 0, 'comparator[facing=west,mode=subtract,powered=false]']
  - [2, 1, 2, redstone_block]
  - [2, 1, 3, 'sticky_piston[extended=false,facing=north]']
  - [3, 1, 0, 'redstone_lamp[lit=false]']
  block_entities:
  - [2, 1, 0, '{id: "minecraft:comparator", OutputSignal: 0}']
ticks: 57
inputs:
- tick: 2
  pos: [0, 1, 0]
  action: use
probes:
  in: [0, 1, 0]
  out: [3, 1, 0]
