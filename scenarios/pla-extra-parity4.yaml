name: pla-extra-parity4
description: 'Fackel-PLA für die Parität von vier Eingängen, 8 Terme (Fackel-PLA (Summe von Produkten): y = (¬a ∧ ¬b ∧ ¬c
  ∧ d) ∨ (¬a ∧ ¬b ∧ c ∧ ¬d) ∨ (¬a ∧ b ∧ ¬c ∧ ¬d) ∨ (¬a ∧ b ∧ c ∧ d) ∨ (a ∧ ¬b ∧ ¬c ∧ ¬d) ∨ (a ∧ ¬b ∧ c ∧ d) ∨ (a ∧ b ∧ ¬c
  ∧ d) ∨ (a ∧ b ∧ c ∧ ¬d). 8 Termspalten mit Wandfackeln an den Leitungen; Sammelleitung und Term-Fackel bilden das AND, Fackeln
  an der Sammelleitung speisen die Ausgangsleitungen (OR).) Alle Hebel-Kombinationen im Gray-Code, je 20 gt Abstand.'
