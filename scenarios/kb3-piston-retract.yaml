name: kb3-piston-retract
description: Einfahrender Kolben. Ein Hebel faehrt den Kolben bei 2 aus. Bei 10 werden zwei Detektoren gesetzt (Repeater
  powered=true ohne Eingang, einer neben der Kolbenbasis, ein Kontroll-Detektor weit weg). Bei 14 faehrt der Kolben
  wieder ein; der Detektor neben der Basis geht nur durch das Update der Basis aus. Der Zeitpunkt zeigt, ob die
  Basis ihre Nachbarn sofort (beim Einfahr-Event) aktualisiert (PIS-017).
build:
  size: [5, 3, 5]
  fill:
  - [0, 0, 0, 4, 0, 4, stone]
  blocks:
  - [0, 1, 2, 'lever[face=floor,facing=east,powered=false]']
  - [1, 1, 2, 'piston[extended=false,facing=east]']
ticks: 26
inputs:
- tick: 2
  pos: [0, 1, 2]
  action: use
- tick: 10
  pos: [1, 1, 1]
  action: setblock
  state: repeater[delay=1,facing=south,locked=false,powered=true]
- tick: 10
  pos: [3, 1, 4]
  action: setblock
  state: repeater[delay=1,facing=north,locked=false,powered=true]
- tick: 14
  pos: [0, 1, 2]
  action: use
probes:
  lever: [0, 1, 2]
  piston: [1, 1, 2]
  head: [2, 1, 2]
  det-base: [1, 1, 1]
  det-control: [3, 1, 4]
