name: pla-encoder7
description: 'Fackel-PLA aus examples/specs/encoder7.yaml (Fackel-PLA (Summe von Produkten): b2 = (h7) ∨ (h6) ∨ (h5) ∨ (h4);
  b1 = (h7) ∨ (h6) ∨ (h3) ∨ (h2); b0 = (h7) ∨ (h5) ∨ (h3) ∨ (h1). 7 Termspalten mit Wandfackeln an den Leitungen; Sammelleitung
  und Term-Fackel bilden das AND, Fackeln an der Sammelleitung speisen die Ausgangsleitungen (OR); gemeinsame Terme belegen
  nur eine Spalte; Repeater frischen lange Leitungen auf.) Jede verlangte Hebel-Kombination an und wieder aus, je 20 gt Abstand.'
