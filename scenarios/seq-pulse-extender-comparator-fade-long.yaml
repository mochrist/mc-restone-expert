name: seq-pulse-extender-comparator-fade-long
description: 'Vorlage pulse-extender-comparator-fade-long (length=50, delay=10) aus src/redstone/design/seq_templates.py:
  Lever -> kurzer Puls (Komparator-Subtraktion) -> Ring aus Komparatoren im Vergleichsmodus mit Staub in den Ecken. Der Staub
  kostet je Halbrunde 1 Signalstärke, der Puls kreist also und schwindet (Fade-out), bis er weg ist; die Dauer bestimmt die
  Startstärke (Staublänge vor dem Ring) und die Ringgröße. Ein Komparator am Ende liest den Ring. Großer Ring (zwei Komparatoren
  je Reihe) und 6-gt-Startpuls für Mindestlängen von 34 bis 50 gt; sonst wie pulse-extender-comparator-fade. Testabläufe nacheinander:
  Hebel 1 gt an ab Tick 0; Hebel 2 gt an ab Tick 112; Hebel 3 gt an ab Tick 224; Hebel 5 gt an ab Tick 336; Hebel 10 gt an
  ab Tick 448; Hebel 20 gt an ab Tick 560; Hebel 40 gt an ab Tick 672.'
