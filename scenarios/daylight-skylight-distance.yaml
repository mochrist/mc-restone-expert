name: daylight-skylight-distance
description: >
  Himmelslicht am Tageslichtsensor unter einem Dach (DAY-006). Zwei lange Räume mit Steinwänden und Steindach,
  nur an den Enden x=0 und x=13 offen. Invertierte Sensoren bei x=1..12 lesen 15 minus Himmelslicht, also den
  Abstand zur nächsten Zelle mit offenem Himmel (Erwartung 1..6 und 6..1). Raum A (z=1): Dach bei y=3. Raum B
  (z=5): Dach bei y=6 (hoher Raum), Sensoren ebenfalls bei y=1. Die Sensoren sind veraltet (Stärke 0) gesetzt;
  die erste Aktualisierung kommt vom 20-gt-Takt. game_time gibt die Phase vor (docs/scenario-format.md).
game_time: 30843
