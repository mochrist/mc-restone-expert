name: seq-clock-torch-repeater
description: 'Vorlage clock-torch-repeater (period=12, on_ticks=6) aus src/redstone/design/seq_templates.py: Wandfackel an
  einem Block, Staub im Bogen zurück, ein Verstärker versorgt den Block: Die Fackel schaltet sich verzögert selbst aus und
  wieder an. Ab Stufe 2 brennt sie nicht durch. Lampe unter dem Staub. Gestartet wird sie, indem der Block bei [0, 1, 1] bei
  Tick 2 gesetzt wird.'
build:
  size: [3, 2, 2]
  blocks:
  - [0, 1, 0, stone]
  - [1, 0, 0, stone]
  - [1, 0, 1, stone]
  - [1, 1, 0, 'repeater[delay=2,facing=east,locked=false,powered=false]']
  - [1, 1, 1, 'redstone_wire[east=side,north=none,power=0,south=none,west=side]']
  - [2, 0, 0, stone]
  - [2, 0, 1, 'redstone_lamp[lit=false]']
  - [2, 1, 0, 'redstone_wire[east=none,north=none,power=0,south=side,west=side]']
  - [2, 1, 1, 'redstone_wire[east=none,north=side,power=0,south=none,west=side]']
ticks: 202
inputs:
- tick: 2
  pos: [0, 1, 1]
  action: setblock
  state: redstone_wall_torch[facing=south,lit=true]
probes:
  out: [2, 0, 1]
