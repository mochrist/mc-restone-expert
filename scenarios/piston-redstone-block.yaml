name: piston-redstone-block
description: >
  Sticky Piston schiebt einen Redstone-Block von einer Lampe (A) weg zu einer anderen Lampe (B) und zieht ihn
  wieder zurück. B geht an, sobald der Block ankommt (Block-Entity-Phase, Flags 67); A geht 4 Ticks nach dem
  Wegschieben aus (die Position wird sofort moving_piston).
build:
  size: [4, 2, 2]
  fill:
    - [0, 0, 0, 3, 0, 1, "stone"]
  blocks:
    - [0, 1, 0, "lever[face=floor,facing=east,powered=false]"]
    - [1, 1, 0, "sticky_piston[extended=false,facing=east]"]
    - [2, 1, 0, "redstone_block"]
    - [2, 1, 1, "redstone_lamp[lit=true]"]
    - [3, 1, 1, "redstone_lamp[lit=false]"]
ticks: 25
inputs:
  - {tick: 2, pos: [0, 1, 0], action: use}
  - {tick: 12, pos: [0, 1, 0], action: use}
probes:
  piston: [1, 1, 0]
  head: [2, 1, 0]
  dest: [3, 1, 0]
  lamp_a: [2, 1, 1]
  lamp_b: [3, 1, 1]
