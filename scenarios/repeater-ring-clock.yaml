name: repeater-ring-clock
description: >
  Ring aus vier Repeatern (je 1 Tick) mit Staub in den Ecken, alles aus. Bei Tick 2 wird neben der
  Nordwest-Ecke ein Redstone-Block gesetzt und bei Tick 3 wieder entfernt. Der Puls läuft danach im Ring
  um (Periode 8 gt). Die Lampe unter der Ecke flackert.
build:
  size: [4, 2, 3]
  fill:
    - [1, 0, 0, 3, 0, 2, "stone"]
  blocks:
    - [1, 0, 0, "redstone_lamp[lit=false]"]
    - [1, 1, 0, "redstone_wire[east=side,north=none,power=0,south=side,west=none]"]
    - [2, 1, 0, "repeater[delay=1,facing=west,locked=false,powered=false]"]
    - [3, 1, 0, "redstone_wire[east=none,north=none,power=0,south=side,west=side]"]
    - [3, 1, 1, "repeater[delay=1,facing=north,locked=false,powered=false]"]
    - [3, 1, 2, "redstone_wire[east=none,north=side,power=0,south=none,west=side]"]
    - [2, 1, 2, "repeater[delay=1,facing=east,locked=false,powered=false]"]
    - [1, 1, 2, "redstone_wire[east=side,north=side,power=0,south=none,west=none]"]
    - [1, 1, 1, "repeater[delay=1,facing=south,locked=false,powered=false]"]
ticks: 40
inputs:
  - {tick: 2, pos: [0, 1, 0], action: setblock, state: "redstone_block"}
  - {tick: 3, pos: [0, 1, 0], action: setblock, state: "air"}
probes:
  corner: [1, 1, 0]
  lamp: [1, 0, 0]
  r_east: [2, 1, 0]
  r_south: [1, 1, 1]
