name: tpl-buffer-direct
description: Vorlage buffer-direct aus src/redstone/design/templates.py (Hebel direkt auf der Lampe; der Hebel versorgt den
  Block, an dem er hängt. Verzögerung 0 gt.) Alle Hebel-Kombinationen im Gray-Code, je 20 gt Abstand.
build:
  size: [1, 2, 1]
  blocks:
  - [0, 0, 0, 'redstone_lamp[lit=false]']
  - [0, 1, 0, 'lever[face=floor,facing=north,powered=false]']
ticks: 42
inputs:
- tick: 2
  pos: [0, 1, 0]
  action: use
- tick: 22
  pos: [0, 1, 0]
  action: use
probes:
  a: [0, 1, 0]
  y: [0, 0, 0]
