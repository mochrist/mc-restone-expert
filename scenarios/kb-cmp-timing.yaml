name: kb-cmp-timing
description: >
  Diagnose Comparator-Timing (nur Analyse). z=0: Comparator liest Staub 7, Rechtsklick bei Tick 2, Repeater (Delay 1)
  direkt davor. z=2: dasselbe mit Stein dazwischen. z=4: gespeicherter Output 5 (powered=true), Staub wird bei Tick 2
  davor gesetzt. z=6: wie z=4, Staub bei Tick 5 gesetzt. z=8: Hebel -> Staub -> Comparator -> Stein -> Repeater.
  z=10: Comparator liest Staub 7, Staub davor wird bei Tick 2 gesetzt (Comparator ohne gespeicherten Wert).
build:
  size: [7, 3, 12]
  fill:
    - [0, 0, 0, 6, 0, 11, "stone"]
  blocks:
    - [0, 1, 0, "redstone_wire[east=none,north=none,power=7,south=none,west=none]"]
    - [1, 1, 0, "comparator[facing=west,mode=compare,powered=false]"]
    - [2, 1, 0, "repeater[delay=1,facing=west,locked=false,powered=false]"]
    - [0, 1, 2, "redstone_wire[east=none,north=none,power=7,south=none,west=none]"]
    - [1, 1, 2, "comparator[facing=west,mode=compare,powered=false]"]
    - [2, 1, 2, "stone"]
    - [3, 1, 2, "repeater[delay=1,facing=west,locked=false,powered=false]"]
    - [1, 1, 4, "comparator[facing=west,mode=compare,powered=true]"]
    - [1, 1, 6, "comparator[facing=west,mode=compare,powered=true]"]
    - [0, 1, 8, "lever[face=floor,facing=east,powered=false]"]
    - [1, 1, 8, "redstone_wire[east=none,north=none,power=0,south=none,west=none]"]
    - [2, 1, 8, "comparator[facing=west,mode=compare,powered=false]"]
    - [3, 1, 8, "stone"]
    - [4, 1, 8, "repeater[delay=1,facing=west,locked=false,powered=false]"]
    - [0, 1, 10, "redstone_wire[east=none,north=none,power=7,south=none,west=none]"]
    - [1, 1, 10, "comparator[facing=west,mode=compare,powered=false]"]
  block_entities:
    - [1, 1, 0, '{id:"minecraft:comparator",OutputSignal:0}']
    - [1, 1, 2, '{id:"minecraft:comparator",OutputSignal:0}']
    - [1, 1, 4, '{id:"minecraft:comparator",OutputSignal:5}']
    - [1, 1, 6, '{id:"minecraft:comparator",OutputSignal:5}']
    - [2, 1, 8, '{id:"minecraft:comparator",OutputSignal:0}']
    - [1, 1, 10, '{id:"minecraft:comparator",OutputSignal:0}']
ticks: 20
inputs:
  - {tick: 2, pos: [1, 1, 0], action: use}
  - {tick: 2, pos: [1, 1, 2], action: use}
  - {tick: 2, pos: [2, 1, 4], action: setblock, state: "redstone_wire[east=none,north=none,power=0,south=none,west=none]"}
  - {tick: 5, pos: [2, 1, 6], action: setblock, state: "redstone_wire[east=none,north=none,power=0,south=none,west=none]"}
  - {tick: 2, pos: [0, 1, 8], action: use}
  - {tick: 2, pos: [2, 1, 10], action: setblock, state: "redstone_wire[east=none,north=none,power=0,south=none,west=none]"}
probes:
  v1_cmp: [1, 1, 0]
  v1_rep: [2, 1, 0]
  v2_cmp: [1, 1, 2]
  v2_rep: [3, 1, 2]
  v3_cmp: [1, 1, 4]
  v3_dust: [2, 1, 4]
  v4_cmp: [1, 1, 6]
  v4_dust: [2, 1, 6]
  v5_cmp: [2, 1, 8]
  v5_rep: [4, 1, 8]
  v6_cmp: [1, 1, 10]
  v6_dust: [2, 1, 10]
