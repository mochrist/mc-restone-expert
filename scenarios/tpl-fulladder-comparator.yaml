name: tpl-fulladder-comparator
description: Vorlage fulladder-comparator aus src/redstone/design/templates.py (Zwei halfadder-comparator, gespiegelt, teilen
  sich die Übertrags-Lampe (Übertrag = c1 oder c2). Die Summe des ersten (a xor b) versorgt einen Block; von ihm führt eine
  Leitung über die Schaltung (eine Ebene höher, mit Verstärker) zum a-Eingang des zweiten Halbaddierers, dessen b-Eingang
  ist der Hebel c. Verzögerung bis 6 gt; 108 Blöcke statt 270 der Fackel-PLA.) Alle Hebel-Kombinationen im Gray-Code, je 20
  gt Abstand.
