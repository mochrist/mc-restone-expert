  Doppeltruhe mit gemeinsamem Inventar (Items nur in der linken Haelfte, Comparator an beiden Haelften = 8),
  Doppeltruhe mit Stein ueber einer Haelfte (Comparator 0, bis zum naechsten Update nach dem Entfernen),
  Trichter fuellen Einzel- und Doppeltruhe, ein Trichter unter einer Doppeltruhe leert sie,
  Formwechsel single/left/right beim Setzen und Entfernen der Nachbartruhe, Kupfertruhe; Trichter ignorieren die Blockade durch einen Block darueber.
