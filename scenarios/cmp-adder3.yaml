name: cmp-adder3
description: 'Zerlegung für examples/specs/composed/adder3.yaml: halfadder-comparator → fulladder-comparator → fulladder-comparator
  (zerlegt: g, s0 aus (a0, b0), s1, s2, c aus (g, a1, a2, b1, b2); komponiert: template:halfadder-comparator (a0→a, b0→b)
  → zerlegt: g, s1 aus (g, a1, b1), s2, c aus (g, a2, b2); komponiert: template:fulladder-comparator (g→a, a1→b, b1→c) → template:fulladder-comparator
  (g→a, a2→b, b2→c)). Alle Hebel-Kombinationen im Gray-Code, je 40 gt Abstand.'
