name: seq-pulse-extender-comparator-fade
description: 'Vorlage pulse-extender-comparator-fade (length=26, delay=8) aus src/redstone/design/seq_templates.py: Lever
  -> kurzer Puls (Komparator-Subtraktion) -> Ring aus Komparatoren im Vergleichsmodus mit Staub in den Ecken. Der Staub kostet
  je Halbrunde 1 Signalstärke, der Puls kreist also und schwindet (Fade-out), bis er weg ist; die Dauer bestimmt die Startstärke
  (Staublänge vor dem Ring) und die Ringgröße. Ein Komparator am Ende liest den Ring. Der Hebel erreicht die Lampe zusätzlich
  über zwei Verstärker genau so spät wie der Ring, längere Pulse kommen also unverändert durch. Mindestlänge 10 bis 26 gt,
  ohne Kupferbirne. Testabläufe nacheinander: Hebel 1 gt an ab Tick 0; Hebel 2 gt an ab Tick 86; Hebel 3 gt an ab Tick 172;
  Hebel 5 gt an ab Tick 258; Hebel 10 gt an ab Tick 344; Hebel 20 gt an ab Tick 430; Hebel 40 gt an ab Tick 516.'
