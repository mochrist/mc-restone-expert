name: seq-clock-repeater-pair
description: 'Vorlage clock-repeater-pair (period=12, on_ticks=6) aus src/redstone/design/seq_templates.py: Zwei gegenläufige
  Verstärker nebeneinander, an beiden Enden über Staub verbunden; einer ist gespeichert an. An- und Aus-Zeit je eine Verzögerung.
  Lampe unter einer Ecke. Gestartet wird sie, indem der Block bei [0, 1, 1] bei Tick 2 gesetzt wird.'
build:
  size: [3, 2, 2]
  blocks:
  - [0, 0, 0, 'redstone_lamp[lit=false]']
  - [0, 0, 1, stone]
  - [0, 1, 0, 'redstone_wire[east=side,north=none,power=0,south=side,west=none]']
  - [1, 0, 0, stone]
  - [1, 0, 1, stone]
  - [1, 1, 0, 'repeater[delay=3,facing=west,locked=false,powered=true]']
  - [1, 1, 1, 'repeater[delay=3,facing=east,locked=false,powered=false]']
  - [2, 0, 0, stone]
  - [2, 0, 1, stone]
  - [2, 1, 0, 'redstone_wire[east=none,north=none,power=0,south=side,west=side]']
  - [2, 1, 1, 'redstone_wire[east=none,north=side,power=0,south=none,west=side]']
ticks: 202
inputs:
- tick: 2
  pos: [0, 1, 1]
  action: setblock
  state: redstone_wire[east=side,north=side,power=0,south=none,west=none]
probes:
  out: [0, 0, 0]
