name: pla-fulladder
description: 'Fackel-PLA aus examples/specs/fulladder.yaml (Fackel-PLA (Summe von Produkten): sum = (¬a ∧ ¬b ∧ c) ∨ (¬a ∧
  b ∧ ¬c) ∨ (a ∧ ¬b ∧ ¬c) ∨ (a ∧ b ∧ c); carry = (b ∧ c) ∨ (a ∧ c) ∨ (a ∧ b). 7 Termspalten mit Wandfackeln an den Leitungen;
  Sammelleitung und Term-Fackel bilden das AND, Fackeln an der Sammelleitung speisen die Ausgangsleitungen (OR).) Alle Hebel-Kombinationen
  im Gray-Code, je 20 gt Abstand.'
