name: kb2-comparator-updates
description: >
  Comparator-Updates durch Container und Staub. z=0 (UPD-014, UPD-015, CMP-017, CMP-018): Ein Trichter legt einen
  Stein in eine Truhe (10 Steine, Signal bleibt 1); der Comparator mit veraltetem Ausgang 0 liegt hinter einem
  Stein und liest durch ihn; BlockEntity#setChanged löst unabhängig von der Signaländerung ein
  updateNeighbourForOutputSignal aus, das durch den Leiterblock den Comparator erreicht: er schaltet auf 1.
  z=2: Kontrolle ohne Steine im Trichter, der veraltete Ausgang 0 bleibt. z=4 (CMP-017): Comparator direkt an der
  Truhe wird ebenfalls benachrichtigt. z=6 und z=8 (CMP-018): Setzt man einen Block mit Analogsignal (Fass) hinter
  den Stein, geht der Comparator mit veraltetem Ausgang 5 auf 0; ein Block ohne Analogsignal (Glas) löst nichts aus.
  z=12 und z=15 (CMP-015): Ein Comparator mit passendem Ausgang 2, aber veraltetem powered=false schaltet beim
  Neighbor-Update im Tick ein; nur im Modus compare benachrichtigt er danach den Staub vor sich (Stärke 2), im
  Modus subtract (Wert unverändert) nicht. z=10 (DUST-017): Wechselt der Staub von z=12 seine Stärke, bekommt
  auch der Comparator mit veraltetem Ausgang 5 zwei Felder daneben ein Update (Staub aktualisiert die Nachbarn
  seiner Nachbarpositionen) und geht auf 0; der Comparator von z=8 (vier Felder entfernt) nicht.
