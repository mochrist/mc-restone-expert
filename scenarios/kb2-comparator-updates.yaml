    - [0, 2, 2, "hopper[enabled=true,facing=down]"]
    - [1, 1, 2, "stone"]
    - [2, 1, 2, "comparator[facing=west,mode=compare,powered=false]"]
    - [0, 1, 4, "chest[facing=north,type=single,waterlogged=false]"]
