  size: [3, 3, 17]
  fill:
    - [0, 0, 0, 2, 0, 16, "stone"]
  blocks:
    - [0, 1, 0, "chest[facing=north,type=single,waterlogged=false]"]
    - [0, 2, 0, "hopper[enabled=true,facing=down]"]
    - [1, 1, 0, "stone"]
