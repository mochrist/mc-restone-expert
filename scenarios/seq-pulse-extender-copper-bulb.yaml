name: seq-pulse-extender-copper-bulb
description: 'Vorlage pulse-extender-copper-bulb (length=8, delay=8) aus src/redstone/design/seq_templates.py: Steigende Flanke
  wird per Komparator-Subtraktion zu einem 4-gt-Puls; der schaltet eine Kupferbirne ein (sie wechselt bei jeder steigenden
  Flanke). Ein Komparator liest die Birne und speist die Lampe, von der eine Verstärker-Schleife zurück in die Birne führt
  und sie wieder ausschaltet. Zusätzlich erreicht der Hebel die Lampe über zwei Verstärker genau so spät wie die Birne, lange
  Pulse kommen also unverändert durch. Mindestlänge 8 bis 40 gt. Testabläufe nacheinander: Hebel 1 gt an ab Tick 0; Hebel
  2 gt an ab Tick 68; Hebel 3 gt an ab Tick 136; Hebel 5 gt an ab Tick 204; Hebel 10 gt an ab Tick 272; Hebel 20 gt an ab
  Tick 342; Hebel 40 gt an ab Tick 422.'
