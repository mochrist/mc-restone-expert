name: seq-clock-comparator
description: 'Vorlage clock-comparator (period=12, on_ticks=6) aus src/redstone/design/seq_templates.py: Komparator im Subtraktionsmodus
  vor einem Redstone-Block, sein Ausgang läuft über die Lampe und zwei Verstärker zurück an den Seiteneingang und schaltet
  ihn ab. An- und Aus-Zeit gleich lang. Gestartet wird sie, indem der Block bei [0, 1, 0] bei Tick 2 gesetzt wird.'
build:
  size: [3, 2, 3]
  blocks:
  - [1, 0, 0, stone]
  - [1, 0, 1, stone]
  - [1, 0, 2, stone]
  - [1, 1, 0, 'comparator[facing=west,mode=subtract,powered=false]']
  - [1, 1, 1, 'repeater[delay=1,facing=south,locked=false,powered=false]']
  - [1, 1, 2, 'redstone_wire[east=side,north=side,power=0,south=none,west=none]']
  - [2, 0, 1, stone]
  - [2, 0, 2, stone]
  - [2, 1, 0, 'redstone_lamp[lit=false]']
  - [2, 1, 1, 'repeater[delay=1,facing=north,locked=false,powered=false]']
  - [2, 1, 2, 'redstone_wire[east=none,north=side,power=0,south=none,west=side]']
  block_entities:
  - [1, 1, 0, '{id: "minecraft:comparator", OutputSignal: 0}']
ticks: 202
inputs:
- tick: 2
  pos: [0, 1, 0]
  action: setblock
  state: redstone_block
probes:
  out: [2, 1, 0]
