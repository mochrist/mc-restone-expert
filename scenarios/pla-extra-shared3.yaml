name: pla-extra-shared3
description: 'Fackel-PLA mit einem Term für drei Ausgänge (zweite OR-Reihe) (Fackel-PLA (Summe von Produkten): x = (a ∧ b);
  y = (c) ∨ (a ∧ b); z = (¬a ∧ ¬c) ∨ (a ∧ b). 3 Termspalten mit Wandfackeln an den Leitungen; Sammelleitung und Term-Fackel
  bilden das AND, Fackeln an der Sammelleitung speisen die Ausgangsleitungen (OR); gemeinsame Terme belegen nur eine Spalte.)
  Alle Hebel-Kombinationen im Gray-Code, je 20 gt Abstand.'
