name: seq-monostable-comparator-fade
description: 'Vorlage monostable-comparator-fade (length=24, delay=12, kind=lever) aus src/redstone/design/seq_templates.py:
  Monoflop mit Hebel über 8 gt: Das Fade-out-Verlängerungsglied (großer Ring, siehe pulse-extender-comparator-fade-long) macht
  jeden Hebelpuls mindestens so lang wie nötig und speist dann den Rückeingang eines Komparators im Subtraktionsmodus; dasselbe
  Signal läuft über eine Verstärker-Schleife an den Seiteneingang und schaltet den Ausgang nach deren Laufzeit ab. 10 bis
  40 gt. Nicht jede gerade Länge lässt sich einstellen (Rundung der Schleife, Stufen aus der Knopf-Vorlage). Testabläufe nacheinander:
  Hebel 1 gt an ab Tick 0; Hebel 2 gt an ab Tick 88; Hebel 3 gt an ab Tick 176; Hebel 5 gt an ab Tick 264; Hebel 10 gt an
  ab Tick 352; Hebel 20 gt an ab Tick 440; Hebel 40 gt an ab Tick 528.'
