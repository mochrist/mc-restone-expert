name: kb2-copper-chests
description: >
  Kupfertruhen (CHEST-008): Alle acht Kupfertruhen (normal, exposed, weathered, oxidized, jeweils gewachst) mit
  3, 6, ..., 24 Stacks Stein; ein Comparator daneben liest dieselbe Stärke wie bei einer normalen Truhe
  (1 + floor(Stacks / 27 * 14)). Danach eine normale Truhe mit 15 Stacks als Kontrolle, eine Doppelkupfertruhe
  gleicher Art (27 Stacks links, beide Comparator lesen 15) und eine gemischte Doppeltruhe (Kupfer links,
  oxidiert rechts). Rechtsklick auf die Comparator (Moduswechsel) löst die Neuberechnung aus, danach noch einmal.
