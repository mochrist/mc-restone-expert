name: kb-piston-qc
description: >
  Pistons, Dispenser und Crafter ohne und mit Update. z=0 (PIS-001): Ein Piston über einem Redstone-Block, der
  schon beim Aufbau da war, bleibt eingefahren (kein Update); erst das Setzen eines Steins daneben (Tick 8) lässt
  ihn ausfahren. z=3 (BUD-009): Ein bestromt gesetzter Piston prüft sofort und fährt aus. z=6 (DDH-005): Ein
  bestromt gesetzter Dispenser setzt triggered erst bei einem späteren Update (Tick 8). z=9 (PIS-002): Ein
  Redstone-Block vor dem Piston zählt nicht; z=12 (PIS-002): Ein Redstone-Block zwei Felder über dem Piston
  aktiviert ihn per Quasi-Connectivity. z=15/18 (QC-003): Derselbe Aufbau mit Crafter: kein QC; mit Redstone-Block
  direkt daneben löst er aus.
build:
  size: [5, 4, 21]
  fill:
    - [0, 0, 0, 4, 0, 20, "stone"]
  blocks:
    - [1, 0, 0, "redstone_block"]
    - [1, 1, 0, "piston[extended=false,facing=east]"]
    - [0, 1, 3, "redstone_block"]
    - [0, 1, 6, "redstone_block"]
    - [1, 1, 9, "piston[extended=false,facing=east]"]
    - [2, 1, 9, "redstone_block"]
    - [1, 1, 12, "piston[extended=false,facing=east]"]
    - [1, 3, 12, "redstone_block"]
    - [1, 1, 15, "crafter[crafting=false,orientation=east_up,triggered=false]"]
    - [1, 3, 15, "redstone_block"]
    - [1, 1, 18, "crafter[crafting=false,orientation=east_up,triggered=false]"]
    - [0, 1, 18, "redstone_block"]
  block_entities:
    - [1, 1, 15, '{id:"minecraft:crafter",Items:[]}']
    - [1, 1, 18, '{id:"minecraft:crafter",Items:[]}']
ticks: 30
inputs:
  - {tick: 2, pos: [1, 1, 3], action: setblock, state: "piston[extended=false,facing=east]"}
  - {tick: 2, pos: [1, 1, 6], action: setblock, state: "dispenser[facing=up,triggered=false]"}
  - {tick: 2, pos: [1, 1, 10], action: setblock, state: "stone"}
  - {tick: 2, pos: [1, 1, 13], action: setblock, state: "stone"}
  - {tick: 2, pos: [1, 1, 16], action: setblock, state: "stone"}
  - {tick: 2, pos: [1, 1, 19], action: setblock, state: "stone"}
  - {tick: 8, pos: [1, 1, 1], action: setblock, state: "stone"}
  - {tick: 8, pos: [1, 2, 6], action: setblock, state: "stone"}
probes:
  a_piston: [1, 1, 0]
  a_head: [2, 1, 0]
  b_piston: [1, 1, 3]
  b_head: [2, 1, 3]
  c_dispenser: [1, 1, 6]
  d_piston: [1, 1, 9]
  d_front: [2, 1, 9]
  e_piston: [1, 1, 12]
  e_head: [2, 1, 12]
  f_crafter: [1, 1, 15]
  g_crafter: [1, 1, 18]
