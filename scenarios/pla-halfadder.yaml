  b) ∨ (a ∧ ¬b). 3 Termspalten mit Wandfackeln an den Leitungen; Sammelleitung und Term-Fackel bilden das AND, Fackeln an
  der Sammelleitung speisen die Ausgangsleitungen (OR).) Alle Hebel-Kombinationen im Gray-Code, je 20 gt Abstand.'
