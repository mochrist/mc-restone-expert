name: kb-comparator-stored
description: >
  Gespeicherter Comparator-Ausgang und starkes Laden. z=0 (CMP-013): Ein Comparator mit gespeichertem OutputSignal 5,
  aber powered=false, gibt dem Staub davor (bei Tick 2 gesetzt) 0; z=4 dasselbe mit powered=true gibt 5. z=8 (CMP-014): Der
  Comparator (liest Staub 7) lädt den Stein vor sich stark, der Repeater dahinter und die Lampe gehen an.
build:
  size: [5, 3, 10]
  fill:
    - [0, 0, 0, 4, 0, 9, "stone"]
  blocks:
    - [1, 1, 0, "comparator[facing=west,mode=compare,powered=false]"]
    - [1, 1, 4, "comparator[facing=west,mode=compare,powered=true]"]
    - [0, 1, 8, "redstone_wire[east=none,north=none,power=7,south=none,west=none]"]
    - [1, 1, 8, "comparator[facing=west,mode=compare,powered=false]"]
    - [2, 1, 8, "stone"]
    - [3, 1, 8, "repeater[delay=1,facing=west,locked=false,powered=false]"]
    - [4, 1, 8, "redstone_lamp[lit=false]"]
  block_entities:
    - [1, 1, 0, '{id:"minecraft:comparator",OutputSignal:5}']
    - [1, 1, 4, '{id:"minecraft:comparator",OutputSignal:5}']
    - [1, 1, 8, '{id:"minecraft:comparator",OutputSignal:0}']
ticks: 30
inputs:
  - {tick: 2, pos: [2, 1, 0], action: setblock, state: "redstone_wire[east=none,north=none,power=0,south=none,west=none]"}
  - {tick: 2, pos: [2, 1, 4], action: setblock, state: "redstone_wire[east=none,north=none,power=0,south=none,west=none]"}
  - {tick: 2, pos: [1, 1, 8], action: use}
probes:
  stored_unpowered_cmp: [1, 1, 0]
  stored_unpowered_dust: [2, 1, 0]
  stored_powered_cmp: [1, 1, 4]
  stored_powered_dust: [2, 1, 4]
  strong_cmp: [1, 1, 8]
  strong_rep: [3, 1, 8]
  strong_lamp: [4, 1, 8]
