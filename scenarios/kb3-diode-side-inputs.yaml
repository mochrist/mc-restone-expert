name: kb3-diode-side-inputs
description: 'Seiteneingaenge von Dioden. Jede Bahn hat ein Ziel (Repeater bzw. Comparator im Subtraktionsmodus)
  mit Hebel dahinter und einer Quelle an der Nordseite. Quelle: Redstone-Block (RB), Hebel (LEV), Staub (DUST),
  gespeister Repeater (DIODE), von einem Hebel angetriebener Stein (STONE). Bei 2 wird die Quelle aktiviert, bei
  6 der Hebel hinter dem Ziel. Repeater sperren nur bei DIODE (powered bleibt aus), Redstone-Block, Staub, Hebel
  und Stein sperren nicht. Comparatoren ziehen die Seitenstaerke ab bei RB, DUST und DIODE (Ausgang 0), nicht bei
  STONE (nur schwach geladen) und nicht bei LEV (ein Bodenhebel gibt nur dem Block unter sich starkes Signal).'
