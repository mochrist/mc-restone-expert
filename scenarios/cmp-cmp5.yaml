name: cmp-cmp5
description: 'Zerlegung für examples/specs/composed/cmp5.yaml: cmp1-comparator → cmp-stage-comparator → cmp-stage-comparator
  → cmp-stage-comparator → cmp-stage-comparator-kompakt (kompaktiert aus zerlegt: g0, g1 aus (a4, b4, a3, b3), gt, lt aus
  (g0, g1, a2, b2, a1, b1, a0, b0); komponiert: zerlegt: g0, g1 aus (a4, b4), g0, g1 aus (g0, g1, a3, b3); komponiert: template:cmp1-comparator
  (a4→a, b4→b) → template:cmp-stage-comparator (g0→gi, g1→li, a3→a, b3→b) → zerlegt: g0, g1 aus (g0, g1, a2, b2, a1, b1),
  gt, lt aus (g0, g1, a0, b0); komponiert: zerlegt: g0, g1 aus (g0, g1, a2, b2), g0, g1 aus (g0, g1, a1, b1); komponiert:
  template:cmp-stage-comparator (g0→gi, g1→li, a2→a, b2→b) → template:cmp-stage-comparator (g0→gi, g1→li, a1→a, b1→b) → template:cmp-stage-comparator
  (g0→gi, g1→li, a0→a, b0→b)). Alle Hebel-Kombinationen im Gray-Code, je 50 gt Abstand.'
