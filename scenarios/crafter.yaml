name: crafter
description: >
  Crafter: Ausloesung per Hebel (Flanke, triggered sofort, Craften 4 gt spaeter, crafting 6 gt lang), Comparator-Ausgang
  (belegte plus gesperrte Slots), disabled_slots, Ausgabe in ein Fass davor. Spuren z=0 (2x9 Eisenbarren -> zwei
  Eisenbloecke), z=2 (1-gt-Puls craftet trotzdem), z=4 (Eichenstamm, Slots 0-3 gesperrt: Comparator 5, danach 4),
  z=6 (Stick-Rezept aus zwei verschiedenen Brettern, verschoben in der Mitte), z=8 (kein Rezept), z=10 (8 Barren,
  ein Slot gesperrt: kein Rezept), z=12 und z=15 (Trichter fuellt den Crafter gleichmaessig, bei z=15 bleibt der
  gesperrte Slot leer; bei z=12 craftet der Hebel bei 70), z=18 (Crafter gibt in einen gesperrten Trichter aus,
  der nach Abschalten das Ergebnis ins Fass weitergibt), z=21 (Redstone-Block setzen/entfernen).
