name: tpl-xor2-stacked
description: 'Vorlage xor2-stacked aus src/redstone/design/templates.py (Zwei Komparatoren im Subtraktionsmodus übereinander:
  der untere (a minus b) versorgt den Block neben der Lampe, der obere (b minus a) den Block auf der Lampe. Jeder Hebel hängt
  am Block, dessen Leitung zum Seiteneingang des anderen Komparators führt. 17 Blöcke, Verzögerung bis 8 gt.) Alle Hebel-Kombinationen
  im Gray-Code, je 20 gt Abstand.'
build:
  size: [4, 3, 3]
  blocks:
  - [0, 1, 1, 'redstone_lamp[lit=false]']
  - [0, 2, 1, stone]
  - [1, 1, 0, stone]
  - [1, 1, 1, stone]
  - [1, 2, 0, 'redstone_wire[east=side,north=none,power=0,south=side,west=none]']
  - [1, 2, 1, 'comparator[facing=east,mode=subtract,powered=false]']
  - [2, 0, 1, stone]
  - [2, 0, 2, stone]
  - [2, 1, 0, stone]
  - [2, 1, 1, 'comparator[facing=east,mode=subtract,powered=false]']
  - [2, 1, 2, 'redstone_wire[east=none,north=side,power=0,south=side,west=none]']
  - [2, 2, 0, 'repeater[delay=1,facing=east,locked=false,powered=false]']
  - [2, 2, 1, 'lever[face=wall,facing=north,powered=false]']
  - [2, 2, 2, stone]
  - [3, 1, 0, stone]
  - [3, 1, 1, 'lever[face=wall,facing=south,powered=false]']
  - [3, 2, 0, 'redstone_wire[east=side,north=none,power=0,south=none,west=side]']
  block_entities:
  - [1, 2, 1, '{id: "minecraft:comparator", OutputSignal: 0}']
  - [2, 1, 1, '{id: "minecraft:comparator", OutputSignal: 0}']
ticks: 82
inputs:
- tick: 2
  pos: [3, 1, 1]
  action: use
- tick: 22
  pos: [2, 2, 1]
  action: use
- tick: 42
  pos: [3, 1, 1]
  action: use
- tick: 62
  pos: [2, 2, 1]
  action: use
probes:
  a: [3, 1, 1]
  b: [2, 2, 1]
  y: [0, 1, 1]
