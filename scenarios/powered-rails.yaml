name: powered-rails
description: >
  Angetriebene Schienen und Aktivierungsschienen. z=0: Hebel an einer Reihe von Antriebsschienen (x=1..12),
  bei x=4 fehlt zunächst eine Schiene. Hebel an (Tick 2): nur x=1..3 gehen an. Bei Tick 6 wird die Lücke per
  setblock mit einer Schiene (shape=north_south) gefüllt; RailState richtet sie auf east_west aus, danach
  leitet die Kette weiter: an sind die direkt versorgte Schiene und 8 weitere (x=1..9), x=10..12 bleiben aus.
  Hebel aus (Tick 12): alle sofort aus. z=2: Weiterleitung über eine Steigung (ascending_east) nach oben.
  z=4: Aktivierungsschienen leiten nur an Aktivierungsschienen weiter, nicht über eine Antriebsschiene hinweg.
build:
  size: [13, 3, 5]
  fill:
    - [0, 0, 0, 12, 0, 4, "stone"]
  blocks:
    - [0, 1, 0, "lever[face=floor,facing=east,powered=false]"]
    - [1, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [2, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [3, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [5, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [6, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [7, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [8, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [9, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [10, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [11, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [12, 1, 0, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [0, 1, 2, "lever[face=floor,facing=east,powered=false]"]
    - [1, 1, 2, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [2, 1, 2, "powered_rail[powered=false,shape=ascending_east,waterlogged=false]"]
    - [3, 1, 2, "stone"]
    - [4, 1, 2, "stone"]
    - [3, 2, 2, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [4, 2, 2, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [0, 1, 4, "lever[face=floor,facing=east,powered=false]"]
    - [1, 1, 4, "activator_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [2, 1, 4, "activator_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [3, 1, 4, "powered_rail[powered=false,shape=east_west,waterlogged=false]"]
    - [4, 1, 4, "activator_rail[powered=false,shape=east_west,waterlogged=false]"]
ticks: 16
inputs:
  - {tick: 2, pos: [0, 1, 0], action: use}
  - {tick: 6, pos: [4, 1, 0], action: setblock, state: "powered_rail[powered=false,shape=north_south,waterlogged=false]"}
  - {tick: 12, pos: [0, 1, 0], action: use}
  - {tick: 2, pos: [0, 1, 2], action: use}
  - {tick: 10, pos: [0, 1, 2], action: use}
  - {tick: 2, pos: [0, 1, 4], action: use}
  - {tick: 10, pos: [0, 1, 4], action: use}
