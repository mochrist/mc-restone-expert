name: qc-bud
description: >
  Quasi-Connectivity: Ein Redstone-Block zwei Blöcke über dem Kolben powert die Position direkt über ihm.
  Der Kolben fährt erst aus, wenn er ein Block-Update bekommt (BUD). Nach dem Entfernen der Quelle
  bleibt er ausgefahren, bis er wieder ein Update bekommt.
build:
  size: [3, 4, 2]
  fill:
    - [0, 0, 0, 2, 0, 1, "stone"]
  blocks:
    - [1, 1, 0, "piston[extended=false,facing=east]"]
ticks: 40
inputs:
  - {tick: 2, pos: [1, 3, 0], action: setblock, state: "redstone_block"}
  - {tick: 10, pos: [1, 1, 1], action: setblock, state: "stone"}
  - {tick: 20, pos: [1, 3, 0], action: setblock, state: "air"}
  - {tick: 30, pos: [1, 1, 1], action: setblock, state: "air"}
probes:
  piston: [1, 1, 0]
  head: [2, 1, 0]
