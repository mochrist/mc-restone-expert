name: pos-zero-tick-piston
description: 'Wie zero-tick-piston, aber mit der Min-Ecke bei [5, 200, 0]. 0-Tick-Puls in der Block-Event-Phase. Ein Wandhebel
  bestromt Piston B (Osten, Stein davor) direkt und Piston S (unter dem Hebel, zeigt nach oben) per Quasi-Connectivity über
  den Trägerblock. B bekommt sein Update zuerst (Update-Reihenfolge W, E, D, ...), also läuft Bs Extend-Event vor dem von
  S. S zerstört den Hebel beim Ausfahren, B verliert dadurch in derselben Block-Event-Phase die Leistung und fährt sofort
  wieder ein (Event 2, weil isHandlingTick). z=0..1: B ist sticky (Stein wird sofort an die ausgefahrene Position gesetzt);
  z=3..4: B ist normal (Stein läuft regulär weiter).

  '
build:
  size: [5, 3, 5]
  blocks:
  - [1, 1, 0, 'piston[extended=false,facing=up]']
  - [1, 2, 0, 'lever[face=wall,facing=north,powered=false]']
  - [1, 2, 1, stone]
  - [2, 2, 0, 'sticky_piston[extended=false,facing=east]']
  - [3, 2, 0, stone]
  - [1, 1, 3, 'piston[extended=false,facing=up]']
  - [1, 2, 3, 'lever[face=wall,facing=north,powered=false]']
  - [1, 2, 4, stone]
  - [2, 2, 3, 'piston[extended=false,facing=east]']
  - [3, 2, 3, stone]
ticks: 12
inputs:
- tick: 2
  pos: [1, 2, 0]
  action: use
- tick: 2
  pos: [1, 2, 3]
  action: use
probes:
  s: [1, 1, 0]
  lever: [1, 2, 0]
  b: [2, 2, 0]
  b_head: [3, 2, 0]
  b_target: [4, 2, 0]
  s2: [1, 1, 3]
  lever2: [1, 2, 3]
  b2: [2, 2, 3]
  b2_head: [3, 2, 3]
  b2_target: [4, 2, 3]
origin: [5, 200, 0]
