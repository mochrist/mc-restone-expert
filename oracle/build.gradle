plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	runs {
		server {
			// The oracle reads <run>/rsx/in and writes <run>/rsx/out (see docs/scenario-format.md).
			runDir "run"
		}
	}
}

// `gradlew runServer -Prsx.exitWhenDone=true` stops the server once all scenarios ran.
// `-Prsx.dumpBlocks=<file>` writes the static block state table on server start (see BlockDump.java).
tasks.named("runServer") {
	def exitWhenDone = providers.gradleProperty("rsx.exitWhenDone").orElse("false")
	def dumpBlocks = providers.gradleProperty("rsx.dumpBlocks").orElse("")
	jvmArgumentProviders.add({
		def args = ["-Drsx.exitWhenDone=" + exitWhenDone.get()]
		if (!dumpBlocks.get().isEmpty()) {
			args << "-Drsx.dumpBlocks=" + dumpBlocks.get()
		}
		args
	} as CommandLineArgumentProvider)
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
