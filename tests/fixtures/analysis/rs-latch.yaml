name: rs-latch
description: >
  RS-NOR-Latch aus zwei Fackeln (B1 bei (2,1,0) mit Fackel T1 östlich, B2 bei (4,1,2) mit Fackel T2 westlich,
  über Staub kreuzweise verbunden). Hebel bei (0,1,0) powert B1, Hebel bei (6,1,2) powert B2. Die Lampe unter
  dem Staub hinter T1 zeigt den Zustand. Gespeichert im Zustand T2 an, T1 aus, Lampe aus.
build:
  size: [7, 2, 3]
  fill:
    - [0, 0, 0, 6, 0, 2, "stone"]
  blocks:
    - [0, 1, 0, "lever[face=floor,facing=east,powered=false]"]
    - [1, 1, 0, "redstone_wire[east=side,north=none,power=0,south=none,west=side]"]
    - [2, 1, 0, "stone"]
    - [3, 1, 0, "redstone_wall_torch[facing=east,lit=false]"]
    - [4, 1, 0, "redstone_wire[east=none,north=none,power=0,south=side,west=side]"]
    - [4, 0, 0, "redstone_lamp[lit=false]"]
    - [4, 1, 1, "redstone_wire[east=none,north=side,power=0,south=side,west=none]"]
    - [4, 1, 2, "stone"]
    - [3, 1, 2, "redstone_wall_torch[facing=west,lit=true]"]
    - [2, 1, 2, "redstone_wire[east=side,north=side,power=15,south=none,west=none]"]
    - [2, 1, 1, "redstone_wire[east=none,north=side,power=14,south=side,west=none]"]
    - [5, 1, 2, "redstone_wire[east=side,north=none,power=0,south=none,west=side]"]
    - [6, 1, 2, "lever[face=floor,facing=west,powered=false]"]
ticks: 1
